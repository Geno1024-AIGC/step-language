name: Deploy Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Test browser compiler
        run: |
          node --check web/preview/compiler.js
          node --check web/preview/preview.js
          node web/preview/test_compiler.js

      - name: Build site
        run: |
          rm -rf _site
          python -m steplang build examples/repair-computer.step -o _site/examples/repair-computer/index.html
          python -m steplang build examples/reinstall-windows.step -o _site/examples/reinstall-windows/index.html
          cp -R examples/images _site/examples/repair-computer/images
          cp -R examples/images _site/examples/reinstall-windows/images
          cp -R web/. _site/
          mkdir -p _site/preview/assets _site/preview/samples _site/preview/images
          cp steplang/assets/app.css steplang/assets/app.js _site/preview/assets/
          cp examples/repair-computer.step examples/reinstall-windows.step _site/preview/samples/
          cp -R examples/images/. _site/preview/images/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
