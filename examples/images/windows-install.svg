<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Windows 启动盘与安装界面示意</title>
  <desc id="desc">左侧是 USB 启动盘，右侧是 Windows 安装程序窗口，中间用箭头连接。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <circle cx="145" cy="225" r="90" fill="#2563eb" opacity=".18" filter="url(#glow)"/>
  <circle cx="610" cy="225" r="120" fill="#0ea5e9" opacity=".12" filter="url(#glow)"/>

  <rect x="52" y="78" width="236" height="294" rx="26" fill="#111c2e" stroke="#263750" stroke-width="2"/>
  <rect x="102" y="102" width="136" height="36" rx="9" fill="#94a3b8"/>
  <rect x="118" y="132" width="104" height="196" rx="18" fill="url(#usb)" stroke="#3b82f6" stroke-width="3"/>
  <rect x="134" y="154" width="72" height="52" rx="9" fill="#0b1220" opacity=".45"/>
  <path d="M148 170h44M148 184h30" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"/>
  <text x="170" y="370" text-anchor="middle" fill="#8ea0ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="4">USB</text>

  <path d="M312 225h96" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="m394 209 22 16-22 16" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="436" y="58" width="312" height="334" rx="24" fill="#111c2e" stroke="#263750" stroke-width="2"/>
  <rect x="436" y="58" width="312" height="54" rx="24" fill="#18243a"/>
  <rect x="436" y="92" width="312" height="20" fill="#18243a"/>
  <circle cx="462" cy="85" r="5" fill="#f87171"/>
  <circle cx="480" cy="85" r="5" fill="#fbbf24"/>
  <circle cx="498" cy="85" r="5" fill="#34d399"/>
  <text x="522" y="91" fill="#8ea0ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">Windows Setup</text>

  <g transform="translate(470 140)">
    <rect width="28" height="28" rx="3" fill="#60a5fa"/>
    <rect x="34" width="28" height="28" rx="3" fill="#60a5fa"/>
    <rect y="34" width="28" height="28" rx="3" fill="#60a5fa"/>
    <rect x="34" y="34" width="28" height="28" rx="3" fill="#60a5fa"/>
  </g>
  <text x="558" y="169" fill="#e6edf7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">安装 Windows</text>
  <text x="470" y="208" fill="#8ea0ba" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">选择语言、版本和安装位置</text>

  <rect x="470" y="238" width="244" height="12" rx="6" fill="#1e293b"/>
  <rect x="470" y="238" width="158" height="12" rx="6" fill="#60a5fa"/>
  <text x="470" y="278" fill="#8ea0ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">正在复制文件…</text>

  <rect x="470" y="306" width="108" height="34" rx="8" fill="#1d4ed8"/>
  <text x="524" y="328" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">下一步</text>
  <rect x="588" y="306" width="108" height="34" rx="8" fill="#1e293b" stroke="#31445f"/>
  <text x="642" y="328" text-anchor="middle" fill="#9aa9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">取消</text>

  <text x="400" y="428" text-anchor="middle" fill="#607089" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">BACKUP → USB → BIOS → SETUP → DRIVERS</text>
</svg>
