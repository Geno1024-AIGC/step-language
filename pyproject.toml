[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step-language"
version = "0.1.0"
description = "A tiny DSL that compiles step-by-step workflows into interactive, responsive, low-bandwidth HTML."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
steplang = "steplang.cli:main"
stepc = "steplang.cli:main"

[tool.setuptools.packages.find]
include = ["steplang*"]

[tool.setuptools.package-data]
steplang = ["assets/*"]
